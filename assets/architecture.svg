<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Insurance Claim Live Agent Team architecture</title>
  <desc id="desc">The claimant's browser joins a LiveKit room with a live voice agent and a Tavus avatar. The voice agent calls four background tools, which use a claim team of LLM specialists on LiveKit Inference and a deterministic rules pipeline that builds the claim packet.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .h { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .t { font-size: 13px; font-weight: 600; fill: #0f172a; }
      .s { font-size: 11.5px; fill: #475569; }
      .m { font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #334155; }
      .tool { font-size: 12px; font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #92400e; }
      .lbl { font-size: 11px; fill: #475569; }
      .edge { stroke: #475569; stroke-width: 1.5; fill: none; }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="850" rx="16" fill="#ffffff"/>

  <!-- Title and legend -->
  <text x="30" y="40" font-size="20" font-weight="700" fill="#0f172a">Insurance Claim Live Agent Team</text>
  <g transform="translate(560,28)" font-size="11.5" fill="#334155">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#eff6ff" stroke="#2563eb"/><text x="20" y="11">Client</text>
    <rect x="75" y="0" width="14" height="14" rx="3" fill="#eef2ff" stroke="#4f46e5"/><text x="95" y="11">Voice agent</text>
    <rect x="180" y="0" width="14" height="14" rx="3" fill="#fffbeb" stroke="#d97706"/><text x="200" y="11">Tools</text>
    <rect x="248" y="0" width="14" height="14" rx="3" fill="#f0fdfa" stroke="#0d9488"/><text x="268" y="11">LLM subagent</text>
    <rect x="358" y="0" width="14" height="14" rx="3" fill="#f8fafc" stroke="#64748b"/><text x="378" y="11">Rules</text>
    <rect x="425" y="0" width="14" height="14" rx="3" fill="#fdf2f8" stroke="#db2777"/><text x="445" y="11">Tavus</text>
  </g>

  <!-- Browser -->
  <rect x="30" y="90" width="220" height="390" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="48" y="118" class="h">Claimant browser</text>
  <text x="48" y="136" class="m">livekit-client</text>
  <g class="s">
    <text x="48" y="170">• Mic and camera</text>
    <text x="48" y="194">• Avatar video and audio</text>
    <text x="48" y="218">• Typed turns</text>
    <text x="62" y="233" class="m">lk.chat</text>
    <text x="48" y="257">• Live captions</text>
    <text x="62" y="272" class="m">lk.transcription</text>
    <text x="48" y="296">• Field notebook, needed</text>
    <text x="58" y="311">list, progress, stamps</text>
    <text x="62" y="326" class="m">claim.state</text>
    <text x="48" y="350">• Error notices</text>
    <text x="62" y="365" class="m">claim.event</text>
    <text x="48" y="389">• Evidence photos, sketch</text>
    <text x="48" y="413">• Adjuster packet preview</text>
    <text x="58" y="428">and ZIP download</text>
    <text x="48" y="452">• New intake (new room)</text>
  </g>

  <!-- Web server -->
  <rect x="30" y="560" width="220" height="130" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="48" y="588" class="t">Web server</text>
  <text x="48" y="605" class="m">src/server.ts</text>
  <text x="48" y="630" class="s">Serves the UI</text>
  <text x="48" y="650" class="s">Mints room tokens</text>
  <text x="48" y="670" class="s">Dispatches the agent by name</text>
  <path d="M140,560 L140,484" class="edge" marker-end="url(#arrow)"/>
  <text x="148" y="526" class="lbl">token</text>
  <path d="M250,640 L290,640 L290,445 L326,445" class="edge dash" marker-end="url(#arrow)"/>
  <text x="283" y="580" class="lbl" transform="rotate(-90 283 580)">agent dispatch</text>

  <!-- Browser <-> room -->
  <path d="M254,175 L326,175" class="edge" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="290" y="167" class="lbl" text-anchor="middle">WebRTC</text>
  <path d="M254,300 L326,300" class="edge" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="290" y="292" class="lbl" text-anchor="middle">text</text>
  <text x="290" y="318" class="lbl" text-anchor="middle">streams</text>

  <!-- LiveKit room -->
  <rect x="330" y="90" width="400" height="380" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="346" y="110" class="s" font-weight="600">LiveKit room · one per intake</text>

  <!-- Voice agent -->
  <rect x="350" y="122" width="360" height="170" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="366" y="146" class="h">Live voice agent</text>
  <text x="366" y="163" class="m">ClaimAgent · AgentSession · src/agent.ts</text>
  <rect x="366" y="178" width="128" height="48" rx="8" fill="#ffffff" stroke="#4f46e5"/>
  <text x="430" y="198" class="t" text-anchor="middle">STT</text>
  <text x="430" y="215" class="m" text-anchor="middle" font-size="10">gpt-live-transcribe</text>
  <rect x="506" y="178" width="92" height="48" rx="8" fill="#ffffff" stroke="#4f46e5"/>
  <text x="552" y="198" class="t" text-anchor="middle">LLM</text>
  <text x="552" y="215" class="m" text-anchor="middle" font-size="10">gpt-4.1-mini</text>
  <rect x="610" y="178" width="86" height="48" rx="8" fill="#ffffff" stroke="#4f46e5"/>
  <text x="653" y="198" class="t" text-anchor="middle">TTS</text>
  <text x="653" y="215" class="m" text-anchor="middle" font-size="10">tts-1 · nova</text>
  <path d="M494,202 L503,202" class="edge" marker-end="url(#arrow)"/>
  <path d="M598,202 L607,202" class="edge" marker-end="url(#arrow)"/>
  <text x="366" y="252" class="s">Turn-taking and barge-in, persona and tool rules,</text>
  <text x="366" y="268" class="s">camera-mode notices, silent claim-team context</text>

  <!-- Avatar and camera tap -->
  <path d="M435,292 L435,318" class="edge" marker-end="url(#arrow)"/>
  <text x="442" y="310" class="lbl">audio</text>
  <rect x="350" y="320" width="170" height="125" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
  <text x="366" y="345" class="t">Tavus avatar</text>
  <text x="366" y="362" class="m">plugin-tavus</text>
  <text x="366" y="386" class="s">Joins as its own</text>
  <text x="366" y="402" class="s">participant and lip-syncs</text>
  <text x="366" y="418" class="s">the agent's voice</text>

  <rect x="560" y="320" width="150" height="125" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="576" y="345" class="t">Camera tap</text>
  <text x="576" y="369" class="s">Newest claimant</text>
  <text x="576" y="385" class="s">frame only; avatar</text>
  <text x="576" y="401" class="s">video never counts.</text>
  <text x="576" y="417" class="s">JPEG on demand</text>

  <!-- Tools -->
  <path d="M710,160 L766,160" class="edge" marker-end="url(#arrow)"/>
  <text x="738" y="152" class="lbl" text-anchor="middle">tool calls</text>
  <path d="M710,382 L745,382 L745,234 L766,234" class="edge" marker-end="url(#arrow)"/>
  <text x="752" y="306" class="lbl">frame</text>

  <rect x="770" y="90" width="400" height="200" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="788" y="116" class="h">Background tools</text>
  <text x="788" y="133" class="s">AsyncToolset: progress now, result when the agent is idle</text>
  <g>
    <rect x="788" y="145" width="364" height="30" rx="6" fill="#ffffff" stroke="#fcd34d"/>
    <text x="800" y="165" class="tool">lookup_policy</text><text x="1140" y="165" class="s" text-anchor="end">verify policy record</text>
    <rect x="788" y="182" width="364" height="30" rx="6" fill="#ffffff" stroke="#fcd34d"/>
    <text x="800" y="202" class="tool">sync_claim_packet</text><text x="1140" y="202" class="s" text-anchor="end">rerun the claim team</text>
    <rect x="788" y="219" width="364" height="30" rx="6" fill="#ffffff" stroke="#fcd34d"/>
    <text x="800" y="239" class="tool">pin_evidence_photo</text><text x="1140" y="239" class="s" text-anchor="end">capture and verify frame</text>
    <rect x="788" y="256" width="364" height="30" rx="6" fill="#ffffff" stroke="#fcd34d"/>
    <text x="800" y="276" class="tool">draw_incident_sketch</text><text x="1140" y="276" class="s" text-anchor="end">illustrate the scene</text>
  </g>

  <!-- Policy directory -->
  <path d="M880,290 L880,316" class="edge" marker-end="url(#arrow)"/>
  <rect x="770" y="320" width="230" height="125" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="788" y="345" class="t">Mock policy directory</text>
  <text x="788" y="362" class="m">policyDirectory.ts</text>
  <text x="788" y="386" class="s">Six demo records; spoken</text>
  <text x="788" y="402" class="s">numbers and O/0 mix-ups</text>
  <text x="788" y="418" class="s">are normalized</text>

  <!-- Tools -> claim team -->
  <path d="M1085,290 L1085,506" class="edge" marker-end="url(#arrow)"/>
  <text x="1094" y="380" class="lbl">sync,</text>
  <text x="1094" y="395" class="lbl">capture,</text>
  <text x="1094" y="410" class="lbl">sketch</text>

  <!-- Claim team -> voice agent -->
  <path d="M540,506 L540,296" class="edge" marker-end="url(#arrow)"/>
  <text x="550" y="492" class="lbl">updates as silent context · new safety escalation interrupts and speaks</text>
  <path d="M410,474 L410,506" class="edge dash" marker-end="url(#arrow)"/>
  <text x="402" y="492" class="lbl" text-anchor="end">each claimant turn</text>

  <!-- Claim team -->
  <rect x="330" y="510" width="840" height="320" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="350" y="537" class="h">Claim team</text>
  <text x="440" y="537" class="s">IntakeSession · src/intake.ts · per-call state, results cached by transcript revision</text>

  <text x="350" y="563" class="s" font-weight="600">LLM specialists on LiveKit Inference</text>
  <g>
    <rect x="350" y="573" width="188" height="72" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
    <text x="364" y="595" class="t">Normalizer</text><text x="524" y="595" class="m" text-anchor="end">gpt-5-mini</text>
    <text x="364" y="615" class="s">Transcript to structured</text>
    <text x="364" y="631" class="s">facts with source turns</text>

    <rect x="554" y="573" width="188" height="72" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
    <text x="568" y="595" class="t">Classifier</text><text x="728" y="595" class="m" text-anchor="end">gpt-5-mini</text>
    <text x="568" y="615" class="s">Claim type, severity,</text>
    <text x="568" y="631" class="s">urgency</text>

    <rect x="758" y="573" width="188" height="72" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
    <text x="772" y="595" class="t">Vision verifier</text><text x="932" y="595" class="m" text-anchor="end">gpt-5-mini</text>
    <text x="772" y="615" class="s">Describes the frame</text>
    <text x="772" y="631" class="s">independently</text>

    <rect x="962" y="573" width="188" height="72" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
    <text x="976" y="595" class="t">Sketch artist</text><text x="1136" y="595" class="m" text-anchor="end">gpt-5</text>
    <text x="976" y="615" class="s">Incident illustration as</text>
    <text x="976" y="631" class="s">SVG, sanitized</text>
  </g>

  <path d="M420,645 L420,700" class="edge" marker-end="url(#arrow)"/>
  <path d="M600,645 L600,700" class="edge" marker-end="url(#arrow)"/>
  <path d="M852,645 L852,672 L728,672 L728,700" class="edge dash" marker-end="url(#arrow)"/>
  <text x="860" y="668" class="lbl">verified captures count as received evidence</text>

  <text x="350" y="810" class="s" font-weight="600">Deterministic rules · src/claim/policies.ts</text>
  <g>
    <rect x="350" y="704" width="140" height="80" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="362" y="727" class="t">Field validation</text>
    <text x="362" y="747" class="s">Required facts,</text>
    <text x="362" y="763" class="s">dates, follow-ups</text>

    <rect x="515" y="704" width="140" height="80" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="527" y="727" class="t">Coverage gates</text>
    <text x="527" y="747" class="s">Policy status and</text>
    <text x="527" y="763" class="s">evidence rules</text>

    <rect x="680" y="704" width="140" height="80" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="692" y="727" class="t">Doc checklist</text>
    <text x="692" y="747" class="s">Per claim type,</text>
    <text x="692" y="763" class="s">received vs. needed</text>

    <rect x="845" y="704" width="140" height="80" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="857" y="727" class="t">Fraud and safety</text>
    <text x="857" y="747" class="s">Signals and human</text>
    <text x="857" y="763" class="s">review routing</text>

    <rect x="1010" y="704" width="140" height="80" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="1022" y="727" class="t">Claim packet</text>
    <text x="1022" y="747" class="s">Markdown, evidence,</text>
    <text x="1022" y="763" class="s">sketch, ZIP</text>

    <path d="M490,744 L511,744" class="edge" marker-end="url(#arrow)"/>
    <path d="M655,744 L676,744" class="edge" marker-end="url(#arrow)"/>
    <path d="M820,744 L841,744" class="edge" marker-end="url(#arrow)"/>
    <path d="M985,744 L1006,744" class="edge" marker-end="url(#arrow)"/>
  </g>
</svg>
